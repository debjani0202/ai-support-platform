spring.application.name=ai-support-platform

spring.datasource.url=jdbc:postgresql://localhost:5435/ai_support_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

server.error.include-message=never
server.error.include-stacktrace=never

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true


logging.level.org.springframework.security=INFO
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# CORS allowed origins: Comma-separated list of trusted frontend origins.
# Local development defaults to Vite dev (5173-5176) and Vite preview (4173).
# In production, set the APP_CORS_ALLOWED_ORIGINS environment variable
# to the exact origin(s) of your deployed frontend (e.g. https://support.example.com).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:4173}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}



# Refresh token and cookie configuration
app.auth.cookie.name=refreshToken
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=Lax
app.auth.refresh-token.expiration-days=${APP_AUTH_REFRESH_TOKEN_EXPIRATION_DAYS:7}

# Local AI configuration
#Tells our future Java code where Ollama is running.
app.ai.ollama.base-url=http://localhost:11434
#Tells our future Java code which AI model to request.
app.ai.ollama.model=qwen3:4b
app.ai.ollama.connect-timeout-ms=${APP_AI_OLLAMA_CONNECT_TIMEOUT_MS:3000}
app.ai.ollama.request-timeout-ms=${APP_AI_OLLAMA_REQUEST_TIMEOUT_MS:10000}
app.ai.ollama.max-concurrent-requests=${APP_AI_OLLAMA_MAX_CONCURRENT_REQUESTS:2}

# Ticket attachment upload and local storage configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=12MB
app.attachments.storage-dir=${APP_ATTACHMENTS_STORAGE_DIR:./uploads/attachments}
app.attachments.max-file-size-bytes=10485760
app.attachments.max-per-ticket=20
