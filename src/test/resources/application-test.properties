
spring.application.name=ai-support-platform-test

spring.datasource.url=jdbc:postgresql://localhost:5434/ai_support_test_db
spring.datasource.username=ai_support_test
spring.datasource.password=${TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.core.env=TRACE